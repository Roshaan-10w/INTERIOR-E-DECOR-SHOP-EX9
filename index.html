
<!DOCTYPE html>
<html lang="en" ng-app="decorApp">

<head>
    <meta charset="UTF-8">

    <title>Interior E-Decor Shop</title>

    <!-- AngularJS Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- AngularJS Routing Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5eee5;
        }

        header {
            background: #65452e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #9b7555;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffe0b5;
        }

        .container {
            background: white;
            max-width: 750px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #70452c;
        }

        input:not([type="radio"]),
        select {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        input[type="radio"] {
            width: auto;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: #805333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .product {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>INTERIOR E-DECOR SHOP</h1>

        <p>Beautiful Designs for Beautiful Homes</p>

    </header>

    <!-- NAVIGATION -->

    <nav>

        <a href="#!/">Home</a>

        <a href="#!/shop">Products</a>

        <a href="#!/about">About Us</a>

        <a href="#!/contact">Contact</a>

        <a href="#!/register">Register</a>

    </nav>

    <!-- ROUTING CONTENT -->

    <div ng-view></div>

    <script>

        // Create AngularJS Application

        var app = angular.module(
            "decorApp",
            ["ngRoute"]
        );

        // Configure Routing

        app.config(function($routeProvider) {

            $routeProvider

            // HOME PAGE

            .when("/", {

                template: `
                <div class="container">

                    <h2>Welcome to Interior E-Decor Shop</h2>

                    <p>
                    Discover beautiful furniture and
                    decorative accessories for your home.
                    </p>

                    <h3>Our Collections</h3>

                    <p>
                    Modern Furniture |
                    Wall Art |
                    Lighting |
                    Home Accessories
                    </p>

                </div>`

            })

            // PRODUCTS PAGE

            .when("/shop", {

                template: `
                <div class="container">

                    <h2>Our Products</h2>

                    <div class="product">
                        <h3>Modern Sofa</h3>
                        <p>Price: Rs. 25000</p>
                    </div>

                    <div class="product">
                        <h3>Wall Painting</h3>
                        <p>Price: Rs. 3500</p>
                    </div>

                    <div class="product">
                        <h3>Table Lamp</h3>
                        <p>Price: Rs. 2500</p>
                    </div>

                    <div class="product">
                        <h3>Decor Vase</h3>
                        <p>Price: Rs. 1500</p>
                    </div>

                </div>`

            })

            // ABOUT PAGE

            .when("/about", {

                template: `
                <div class="container">

                    <h2>About Us</h2>

                    <p>
                    Interior E-Decor Shop provides
                    stylish and affordable interior
                    decoration products.
                    </p>

                    <p>
                    Our aim is to make every home
                    beautiful, comfortable and attractive.
                    </p>

                </div>`

            })

            // CONTACT PAGE

            .when("/contact", {

                template: `
                <div class="container">

                    <h2>Contact Us</h2>

                    <p>Email: interiordecor@gmail.com</p>

                    <p>Phone: 9876543210</p>

                    <p>Address: Coimbatore, Tamil Nadu</p>

                </div>`

            })

            // REGISTRATION PAGE

            .when("/register", {

                template: `

                <div class="container"
                     ng-controller="RegisterController">

                    <h2>Customer Registration Form</h2>

                    <form name="regForm"
                          ng-submit="submitForm()"
                          novalidate>

                        <label>Name *</label>

                        <input type="text"
                               name="name"
                               ng-model="user.name"
                               ng-pattern="/^[A-Za-z ]+$/"
                               required>

                        <p class="error"
                           ng-show="regForm.name.$touched &&
                                    regForm.name.$invalid">

                            Enter a valid name using alphabets only.

                        </p>


                        <label>Password *</label>

                        <input type="password"
                               name="password"
                               ng-model="user.password"
                               ng-pattern="/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$/"
                               required>

                        <p class="error"
                           ng-show="regForm.password.$touched &&
                                    regForm.password.$invalid">

                            Password must contain uppercase,
                            lowercase, number and minimum
                            8 characters.

                        </p>


                        <label>Age *</label>

                        <input type="number"
                               name="age"
                               ng-model="user.age"
                               min="18"
                               max="30"
                               required>

                        <p class="error"
                           ng-show="regForm.age.$touched &&
                                    regForm.age.$invalid">

                            Age must be between 18 and 30.

                        </p>


                        <label>Mobile Number *</label>

                        <input type="text"
                               name="mobile"
                               ng-model="user.mobile"
                               ng-pattern="/^[0-9]{10}$/"
                               required>

                        <p class="error"
                           ng-show="regForm.mobile.$touched &&
                                    regForm.mobile.$invalid">

                            Enter a valid 10-digit mobile number.

                        </p>


                        <label>Email *</label>

                        <input type="email"
                               name="email"
                               ng-model="user.email"
                               required>

                        <p class="error"
                           ng-show="regForm.email.$touched &&
                                    regForm.email.$invalid">

                            Enter a valid email address.

                        </p>


                        <label>Gender *</label>

                        <br>

                        <input type="radio"
                               name="gender"
                               ng-model="user.gender"
                               value="Male"
                               required>

                        Male

                        <input type="radio"
                               name="gender"
                               ng-model="user.gender"
                               value="Female"
                               required>

                        Female

                        <p class="error"
                           ng-show="regForm.gender.$touched &&
                                    regForm.gender.$invalid">

                            Please select your gender.

                        </p>


                        <br>

                        <label>State *</label>

                        <select name="state"
                                ng-model="user.state"
                                required>

                            <option value="">
                                Select State
                            </option>

                            <option value="Tamil Nadu">
                                Tamil Nadu
                            </option>

                            <option value="Kerala">
                                Kerala
                            </option>

                            <option value="Karnataka">
                                Karnataka
                            </option>

                            <option value="Andhra Pradesh">
                                Andhra Pradesh
                            </option>

                        </select>

                        <p class="error"
                           ng-show="regForm.state.$touched &&
                                    regForm.state.$invalid">

                            Please select your state.

                        </p>


                        <br><br>

                        <button type="submit"
                                ng-disabled="regForm.$invalid">

                            Submit

                        </button>

                    </form>


                    <div ng-if="submitted">

                        <h3>Registration Successful!</h3>

                        <p>Name: {{user.name}}</p>

                        <p>Age: {{user.age}}</p>

                        <p>Mobile: {{user.mobile}}</p>

                        <p>Email: {{user.email}}</p>

                        <p>Gender: {{user.gender}}</p>

                        <p>State: {{user.state}}</p>

                    </div>

                </div>`

            })

            .otherwise({

                redirectTo: "/"

            });

        });


        // Registration Controller

        app.controller(
            "RegisterController",
            function($scope) {

                $scope.user = {};

                $scope.submitted = false;

                $scope.submitForm = function() {

                    if ($scope.regForm.$valid) {

                        $scope.submitted = true;

                    }

                };

            }
        );

    </script>

</body>

</html>
